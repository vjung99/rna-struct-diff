# RF2NA eval environment
#
# macOS / arm64 (CPU only) — this is what is installed in tools/RoseTTAFold2NA/env:
#   DGL's newest arm64 wheel (2.2.0) ships graphbolt dylibs for torch 2.1.0..2.3.0
#   only, and torchdata must predate the DILL_AVAILABLE removal, hence the pins.
#
#   uv venv --python 3.10 env
#   uv pip install --python env/bin/python \
#       "torch==2.1.0" "torchdata==0.7.1" "numpy<2" "e3nn==0.3.3" \
#       numpy scipy requests psutil tqdm pyyaml pydantic "dgl==2.2.0"
#   uv pip install --python env/bin/python ./SE3Transformer
#
# Linux / CUDA (the intended compute host) — install a CUDA torch first, then DGL
# from DGL's own wheel index for the matching CUDA version:
#
#   uv venv --python 3.10 env
#   uv pip install --python env/bin/python \
#       "torch==2.1.0" --index-url https://download.pytorch.org/whl/cu121
#   uv pip install --python env/bin/python \
#       "dgl==2.2.0" -f https://data.dgl.ai/wheels/cu121/repo.html
#   uv pip install --python env/bin/python \
#       "torchdata==0.7.1" "numpy<2" "e3nn==0.3.3" scipy requests psutil tqdm pyyaml pydantic
#   uv pip install --python env/bin/python ./SE3Transformer
#
# weights (1.1 GB, once):
#   cd network && curl -LO https://files.ipd.uw.edu/dimaio/RF2NA_apr23.tgz && tar xzf RF2NA_apr23.tgz
#
# template-DB stand-in — required only because predict.py opens args.db at startup,
# it is never read for R: inputs:
#   : > stub/stub_pdb.ffindex && printf '\n' > stub/stub_pdb.ffdata

torch==2.1.0
dgl==2.2.0
torchdata==0.7.1
e3nn==0.3.3
numpy<2
scipy
requests
psutil
